name: CI

on:
  push:
    branches: [main, development, fork-v2]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Run tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Build Server
        working-directory: apps/server
        run: bun run build

      - name: Build Desktop
        working-directory: apps/desktop
        run: bun run build
