name: CI

on:
  push:
    branches: [main, development, fork]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

      - name: Run tests
        run: bun run test

      - name: Build Server
        working-directory: apps/server
        run: bun run build

      - name: Build Desktop
        working-directory: apps/desktop
        run: bun run build
