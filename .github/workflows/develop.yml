name: Publish Development Artifacts

on:
  push:
    branches: [fork]
  workflow_dispatch:

concurrency:
  group: docker-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-server-docker-image:
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build server artifacts
        uses: ./.github/actions/build-sharkord

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          docker_registry: ghcr.io
          docker_username: ${{ github.repository_owner }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
          images: ghcr.io/${{ github.repository }}
          tags: dev
          labels: |
            org.opencontainers.image.title=Sharkord
            org.opencontainers.image.description=Sharkord Server (dev)
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/sharkord
            org.opencontainers.image.revision=${{ github.sha }}

  publish-desktop:
    needs: [ci]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: sharkord-desktop-linux
          - os: windows-latest
            artifact_name: sharkord-desktop-win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build desktop artifacts
        uses: ./.github/actions/build-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/build/out/*.AppImage
            apps/desktop/build/out/*.exe
