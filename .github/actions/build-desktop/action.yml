name: Build Sharkord Desktop
description: Install Bun dependencies and build desktop artifacts. Requires checkout before use.

inputs:
  bun_version:
    description: Bun version to install
    required: false
    default: 1.3.10

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ inputs.bun_version }}

    - name: Install dependencies
      shell: bash
      run: bun install

    - name: Build app
      shell: bash
      working-directory: apps/desktop
      run: bun run publish
