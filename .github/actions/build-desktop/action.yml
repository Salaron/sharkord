name: Build Sharkord Desktop
description: Install Bun dependencies and build desktop artifacts. Requires checkout before use.

inputs:
  bun_version:
    description: Bun version to install
    required: false
    default: 1.3.10

  version:
    description: Sharkord version
    required: false

outputs:
  version:
    description: 'Current Sharkord version'
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun_version }}

    - name: Install dependencies
      shell: bash
      run: bun install

    - name: Set version
      if: ${{ inputs.version != '' }}
      shell: bash
      working-directory: apps/server
      run: bun run ./build/set-version.ts --version "${{ inputs.version }}"
    
    - name: Get version
      id: version
      shell: bash
      working-directory: apps/server
      run: |
        VERSION=$(jq -r .version package.json)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build app
      shell: bash
      working-directory: apps/desktop
      run: bun run publish
